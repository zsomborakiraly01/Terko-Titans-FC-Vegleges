<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Merch Shop - Térkő Titánok FC</title>
    <meta name="description" content="A Térkő Titánok FC hivatalos merch shopja: mezek, kiegészítők, felszerelés és különlegességek.">
    <meta name="theme-color" content="#14281a">
    <meta property="og:title" content="Merch Shop - Térkő Titánok FC">
    <meta property="og:description" content="A Térkő Titánok FC hivatalos merch shopja: mezek, kiegészítők, felszerelés és különlegességek.">
    <meta property="og:image" content="img/logo.png">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
    <a class="skip-link" href="#main">Ugrás a tartalomra</a>

    <!-- A menüt a js/core.js tölti be (NAV_ITEMS) -->
    <div id="site-header"></div>

    <main id="main">
        <header class="page-head">
            <div class="container">
                <span class="eyebrow">Webshop</span>
                <h1>Merch Shop <small class="fs-5 fw-normal opacity-75">(<span data-product-count>27</span> termék)</small></h1>
                <p>Hivatalos klubtermékek – viseld a Titánok színeit minden nap!</p>
            </div>
        </header>

        <div class="container py-4 py-lg-5">
            <section class="shop-toolbar mb-4" aria-label="Szűrők">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6 col-lg-5">
                        <label class="form-label mb-1" for="shop-search">Keresés</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search" aria-hidden="true"></i></span>
                            <input type="search" id="shop-search" class="form-control" placeholder="Pl. mez, kulacs, sál…" autocomplete="off">
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <label class="form-label mb-1" for="shop-sort">Rendezés</label>
                        <select id="shop-sort" class="form-select">
                            <option value="default">Alapértelmezett</option>
                            <option value="price-asc">Ár: növekvő</option>
                            <option value="price-desc">Ár: csökkenő</option>
                            <option value="name">Név szerint (A–Z)</option>
                        </select>
                    </div>
                    <div class="col-lg-4 text-lg-end"><span id="shop-count" class="text-muted fw-semibold" aria-live="polite"></span></div>
                    <div class="col-12"><div class="filter-pills" id="shop-filters" role="group" aria-label="Kategória"></div></div>
                </div>
            </section>

            <div class="row g-3 g-lg-4" id="shop-grid"></div>

            <div id="shop-empty" class="text-center py-5" hidden>
                <i class="bi bi-search display-1 text-muted" aria-hidden="true"></i>
                <h2 class="h4 fw-bold mt-3">Nincs a keresésnek megfelelő termék</h2>
                <p class="text-muted">Próbálj másik kifejezést vagy kategóriát.</p>
                <button type="button" class="btn btn-titan-primary" id="shop-reset">Szűrők törlése</button>
            </div>
        </div>
    </main>

    <!-- A láblécet és a kosár-ablakot a js/core.js tölti be -->
    <div id="site-footer"></div>

    <noscript><p class="text-center p-3 mb-0 bg-warning-subtle">A menü, a kosár és a webshop működéséhez engedélyezd a JavaScriptet.</p></noscript>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/core.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
